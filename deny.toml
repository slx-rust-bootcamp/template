[graph]
# 简单点：把当前 crate 所有 feature 都算进去检查
all-features = true

[advisories]
# 使用 Rust 官方漏洞库
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# 现在所有漏洞默认都是 error，不再需要 vulnerability = "deny"
# 如果有要临时忽略的漏洞，可以写在 ignore 里：
ignore = [
    # "RUSTSEC-0000-0000",
]

[bans]
# 检查同一个 crate 是否出现多个版本
multiple-versions = "warn"
wildcards = "allow"
deny = [
    # 这里可以写要彻底禁止的 crate，比如:
    # { crate = "openssl", use-instead = "rustls" },
]
skip = []
skip-tree = []

[sources]
# 非 crates.io 的 registry / git 源一律禁止（学习项目一般只用 crates.io）
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
# 只允许最常见的开源协议
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# 识别 license 文本时要求的置信度，默认就行
confidence-threshold = 0.8

exceptions = [
    # { allow = ["CDLA-Permissive-2.0"], crate = "some-crate" },
]
